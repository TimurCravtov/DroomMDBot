# Run the API server locally with Docker (production runs on Coolify: see deploy/README.md):
#
#   cp .env.example .env        # fill in TRANZY_API_KEY and TELEGRAM_BOT_TOKEN
#   docker compose up -d --build
#
# The SQLite database is kept in the named volume "droommd-data", so it survives
# rebuilds and restarts. The server also backs it up daily into /data/backups.

services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/droommd.db
    volumes:
      - droommd-data:/data
    # Only this machine can reach the API directly; a reverse proxy (Coolify's) fronts it
    # on a server.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Read-only root filesystem: the server only writes to /data.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  droommd-data:
